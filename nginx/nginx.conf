worker_processes 1;
daemon off;

events {
	worker_connections  1024;
}

http {
	sendfile        on;
	keepalive_timeout  65;

	# gzip  on;
	error_log   log/error.log   error;
	access_log  log/access.log;

	server {
		listen       6969;
		server_name  localhost;

		location / {
			root /Users/guntur/dev/;
			index  index.html index.htm;
		}
	}
}
